name: CI and container images

on:
  pull_request:
    branches: [main, infra]
  push:
    branches: [main, infra]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Test and build backend
        run: |
          chmod +x gradlew
          ./gradlew clean test bootJar --no-daemon

  frontend:
    name: Frontend test, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js 22
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build:dev

  ai:
    name: Core AI test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install AI dependencies
        run: python -m pip install --disable-pip-version-check -r ai/requirements.txt

      - name: Run core AI tests
        run: python -m pytest ai/tests

  deployment-config:
    name: Validate deployment configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check shell syntax
        run: bash -n deploy/scripts/common.sh deploy/scripts/deploy-private.sh deploy/scripts/deploy-public.sh

      - name: Render private Compose configuration
        env:
          COMPOSE_PROJECT_NAME: spaceup-ci-private
          BACKEND_IMAGE: ghcr.io/ho-do99/spaceup-backend:0000000000000000000000000000000000000000
          AI_IMAGE: ghcr.io/ho-do99/spaceup-ai:0000000000000000000000000000000000000000
          SPACEUP_SECRET_ENV: /tmp/spaceup-secret.env
          BACKEND_BIND_HOST: 10.10.20.6
          AI_BIND_HOST: 10.10.20.6
        run: |
          printf 'DB_PORT=3307\n' > /tmp/spaceup-secret.env
          docker compose -f deploy/compose.private.yml config --quiet

      - name: Render public Compose configuration
        env:
          COMPOSE_PROJECT_NAME: spaceup-ci-public
          FRONTEND_IMAGE: ghcr.io/ho-do99/spaceup-frontend:0000000000000000000000000000000000000000
          BACKEND_HOST: 10.10.20.6
          AI_HOST: 10.10.20.6
          DOMAIN: spaceup.duckdns.org
          LEGACY_DOMAIN: 101.79.26.89.sslip.io
          LETSENCRYPT_DIR: /tmp/letsencrypt
          CERTBOT_WEBROOT_DIR: /tmp/certbot
          SSL_CERT_PATH: /etc/nginx/certs/live/spaceup.duckdns.org/fullchain.pem
          SSL_KEY_PATH: /etc/nginx/certs/live/spaceup.duckdns.org/privkey.pem
          LEGACY_SSL_CERT_PATH: /etc/nginx/certs/live/101.79.26.89.sslip.io/fullchain.pem
          LEGACY_SSL_KEY_PATH: /etc/nginx/certs/live/101.79.26.89.sslip.io/privkey.pem
        run: docker compose -f deploy/compose.public.yml config --quiet

  publish-images:
    name: Publish ${{ matrix.image }}
    if: github.event_name == 'push'
    needs: [backend, frontend, ai, deployment-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: spaceup-backend
            context: backend
            dockerfile: backend/Dockerfile.dev
          - image: spaceup-frontend
            context: frontend
            dockerfile: frontend/Dockerfile.dev
          - image: spaceup-ai
            context: ai
            dockerfile: ai/Dockerfile.dev
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and publish immutable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ho-do99/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
