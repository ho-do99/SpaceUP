spring:
  application:
    name: spaceup-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spaceup}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:spaceup_user}
    password: ${DB_PASSWORD:spaceup_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./upload/}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-change-in-production-environment-32bytes-이상}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# ⭐ [국토부 전월세 실거래가 API 연동] MOLIT_RENT_API_SERVICE_KEY 환경변수가 없으면 서비스키가 빈 문자열이 되고,
# 실제 동기화(POST /api/rental-transactions/sync) 호출 시 RentalApiConfigurationException(503)이 발생합니다.
external-api:
  molit-rental:
    base-url: https://apis.data.go.kr/1613000/RTMSDataSvcAptRent
    service-key: ${MOLIT_RENT_API_SERVICE_KEY:}
    num-of-rows: 1000
    connect-timeout: 5s
    read-timeout: 20s
    user-agent: Mozilla/5.0 (compatible; Spaceup/1.0)
