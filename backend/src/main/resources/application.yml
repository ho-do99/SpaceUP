spring:
  application:
    name: spaceup-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spaceup}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:spaceup_user}
    password: ${DB_PASSWORD:spaceup_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 기존 25개 실DB는 V1/V2 상당 구조와 기준 데이터를 이미 보유하므로 2에서 시작합니다.
    # 빈 DB에서는 baseline이 생성되지 않고 V1부터 정상 실행됩니다.
    baseline-version: 2
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  scheduling:
    request-auto-cancel:
      enabled: ${REQUEST_AUTO_CANCEL_ENABLED:true}
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://spaceup.duckdns.org}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./upload/}

# NCP Object Storage is opt-in so local development keeps using the existing
# filesystem until the private server explicitly enables it.
object-storage:
  enabled: ${NCP_OBJECT_STORAGE_ENABLED:false}
  endpoint: ${NCP_OBJECT_STORAGE_ENDPOINT:https://kr.object.ncloudstorage.com}
  region: ${NCP_OBJECT_STORAGE_REGION:kr-standard}
  bucket: ${NCP_OBJECT_STORAGE_BUCKET:spaceup-images-20260807}
  access-key: ${NCP_OBJECT_STORAGE_ACCESS_KEY:}
  secret-key: ${NCP_OBJECT_STORAGE_SECRET_KEY:}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-change-in-production-environment-32bytes-이상}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

external-api:
  # ⭐ [AI 인테리어 이미지 생성] GEMINI_API_KEY 환경변수가 비어 있으면 관련 API가 503을 반환합니다.
  # 절대 이 파일에 실제 키 값을 하드코딩하지 마세요 - .env.local(gitignore 미적용, 팀 공유 저장소) 대신
  # 로컬 셸 환경변수나 개인 전용 설정으로만 채워 넣으세요.
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com
    model: gemini-2.5-flash-image
    connect-timeout: 5s
    read-timeout: 60s
  # ⭐ [AI/OCR 연동] origin/ai 브랜치의 viewerwall 서비스(포트 8004, POST /api/analyze). 아직 메인
  # docker-compose 네트워크에 포함되어 있지 않아 로컬 기본값은 접근 불가능할 수 있습니다 - AI팀과 네트워크
  # 연결 방법을 별도로 협의해야 합니다.
  ai-floorplan:
    base-url: ${AI_FLOORPLAN_BASE_URL:http://localhost:8004}
    connect-timeout: 5s
    read-timeout: 30s
