name: ${COMPOSE_PROJECT_NAME:-spaceup-dev}

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-dev-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD"
      interval: 10s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "${AI_BIND_HOST:-127.0.0.1}:${AI_PORT:-8000}:8000"
    volumes:
      - ./storage/floorplans:/app/storage/floorplans

  # ⭐ [AI 평면도 분석] 실제로 동작하는 파이프라인은 viewerwall의 POST /api/analyze 하나뿐이고,
  # viewerwall/viewer3d는 내부적으로 ocr+spa를 호출한다(ai/docker-compose.yml 구성을 그대로 이관).
  # ⚠️ ocr은 이 저장소에 없는 로컬 이미지 floorplan4:latest를 FROM으로 사용하므로, 배포 서버에
  # 미리 docker load로 그 이미지를 올려둬야 build가 성공한다. spa는 CUDA 런타임 베이스 이미지라
  # GPU 없이도 기동은 되지만 이미지 용량이 크고 추론이 느릴 수 있다.
  ocr:
    build:
      context: ./ai
      dockerfile: ocr/Dockerfile
    restart: unless-stopped

  spa:
    build:
      context: ./ai/spa
    restart: unless-stopped
    volumes:
      - ./ai/model_weights/segmentation:/models:ro
    environment:
      SPA_FP_MODEL: /models/SPA_FP_test_model.pth
      SPA_CS_MODEL: /models/SPA_CS_test_model.pth

  viewer3d:
    build:
      context: ./ai
      dockerfile: viewerselect/Dockerfile
    restart: unless-stopped
    environment:
      SPA_URL: http://spa:8000
      OCR_URL: http://ocr:8000
    depends_on:
      - ocr
      - spa

  viewerwall:
    build:
      context: ./ai
      dockerfile: viewerwall/Dockerfile
    restart: unless-stopped
    environment:
      SPA_URL: http://spa:8000
      OCR_URL: http://ocr:8000
    depends_on:
      - ocr
      - spa

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - /home/ubuntu/spaceup-secret.env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      AI_BASE_URL: http://ai:8000
      AI_FLOORPLAN_BASE_URL: http://viewerwall:8000
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./storage:/app/storage
    depends_on:
      ai:
        condition: service_started
      viewerwall:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    environment:
      - BACKEND_HOST=${BACKEND_HOST:-backend}
      - AI_HOST=${AI_HOST:-ai}
      - DOMAIN=${DOMAIN:-localhost}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-/etc/nginx/certs/server.crt}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-/etc/nginx/certs/server.key}
    volumes:
      - ./nginx/dev.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${LETSENCRYPT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
      - ${CERTBOT_WEBROOT_DIR:-./nginx/acme}:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_started

volumes:
  mysql-dev-data:
