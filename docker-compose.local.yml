name: ${COMPOSE_PROJECT_NAME:-spaceup-local}

services:
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile.local
    restart: unless-stopped
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "${AI_PORT:-8000}:8000"
    volumes:
      - ./ai:/app
      - ./storage/floorplans:/app/storage/floorplans

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-${MYSQL_DATABASE:-spaceup}}
      DB_USER: ${DB_USER:-${MYSQL_USER:-spaceup_user}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD:-spaceup_password}}
      AI_BASE_URL: http://ai:8000
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - gradle-local-cache:/home/gradle/.gradle
      - ./storage:/app/storage
    depends_on:
      ai:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    restart: unless-stopped
    environment:
      VITE_PORT: ${VITE_PORT:-5173}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-local-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      ai:
        condition: service_started

volumes:
  gradle-local-cache:
  frontend-local-node-modules:
